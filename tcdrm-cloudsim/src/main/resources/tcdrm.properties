# ---- Scenarios ---------------------------------------------------------------
article.queries = 1000
article.qps = 1.0
seeds = 10
# graines des scenarios a requetes aleatoires (S4, S5) : simulations courtes, plus de graines
dyn.seeds = 30
sensitivity.seeds = 5

# Seuils des ecritures (S4) : memes valeurs que les requetes simples
sla.write.TSLA = 200
sla.write.CSLA = 0.015

# ---- S4 : scenario de l'article avec prix publics et requetes aleatoires ------
# 1000 requetes a 1 requete/s comme l'article, region d'origine au hasard, relations lues entieres,
# prix publics real.*. Periode = 50 requetes (20 periodes) pour que l'algorithme 3 puisse supprimer ;
# cycle de budget = 10 periodes (500 requetes).
s4.queries = 1000
s4.qps = 1.0
s4.periodQueries = 50
s4.cycle = 10
# Modeles de requete tires au hasard pour chaque graine (principe : Q1 = {F1, F5, F20},
# Q2 = {F1, F9, F44}, Q3 = {F1, F9, F25}) : une relation partagee par tous les modeles, une relation
# commune a plusieurs modeles frequents (probabilite s4.commonProb, au moins 2), les autres propres a
# un modele. Parts des modeles frequents : Zipf (exposant s4.zipf) dans un ordre aleatoire. Le dernier
# modele est rare (s4.rare.share) sauf pendant une rafale de s4.rare.burstPeriods periodes placee au
# hasard dans la premiere moitie.
s4.templates = 5
s4.relsPerQuery = 3
s4.commonProb = 0.6
s4.zipf = 1.0
s4.rare.share = 0.01
s4.rare.burstShare = 0.40
s4.rare.burstPeriods = 3
s4.writeProb = 0.15
s4.deltaFrac = 0.05
# PSLA (Eq. 1, acces par periode), suppression : < 2 acces/periode pendant 5 periodes
s4.psla = 5.0
s4.delPsla = 2.0
s4.deltaT = 5
s4.budgetFactor = 0.95
# 20 periodes seulement : fenetre de P1 et horizon tau raccourcis pour S4
# (ces cles remplacent p1.window, p1.minLen et p2.horizon, SimConfig.withPrefix("s4."))
s4.p1.window = 6
s4.p1.minLen = 6
s4.p2.horizon = 3

# ---- S5 : S4 + variation des prix + charge non stationnaire ------------------
# Les cles s5.X remplacent s4.X. 2000 requetes (40 periodes) pour voir deux fois le motif de charge :
# le classement des 4 modeles frequents tourne d'un rang toutes les 5 periodes (motif de 20 periodes,
# = cycle de budget et de saisonnalite de P1) ; variation des prix a la periode 20.
s5.queries = 2000
s5.cycle = 20
s5.shiftPeriods = 5
s5.priceChangePeriod = 20
# Modele intermittent : un modele frequent tire au hasard n'est demande que 4 periodes sur 10
# (50 % des requetes pendant ses phases actives, aucune ensuite) : sa demande part puis revient
# apres plus de deltaT periodes, ce qui provoque des suppressions puis des recreations (thrashing).
s5.intermittent.period = 10
s5.intermittent.on = 4
s5.intermittent.share = 0.5

# ---- Prix publics (S3, S4, S5) ---------------------------------------------------
