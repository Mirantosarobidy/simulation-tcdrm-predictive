providers = Google,AWS,Azure
regions = US,UE,AS

# ---- Table 1 : prix CPU ($ par 10^6 MI) --------------------------------------
cpu.Google.US = 0.020
cpu.Google.UE = 0.025
cpu.Google.AS = 0.027
cpu.AWS.US = 0.020
cpu.AWS.UE = 0.018
cpu.AWS.AS = 0.020
cpu.Azure.US = 0.0095
cpu.Azure.UE = 0.0090
cpu.Azure.AS = 0.0080

# ---- Table 1 : prix I/O ($ par GB ecrit) -------------------------------------
io.Google.US = 0.006
io.Google.UE = 0.006
io.Google.AS = 0.0066
io.AWS.US = 0.0096
io.AWS.UE = 0.008
io.AWS.AS = 0.0096
io.Azure.US = 0.0120
io.Azure.UE = 0.0096
io.Azure.AS = 0.0090

# ---- Table 1 : bande passante ($ par GB) ------------------------------------
bw.intra.US = 0.0015
bw.intra.UE = 0.002
bw.intra.AS = 0.004
bw.interRegion.Google = 0.008
bw.interRegion.AWS = 0.008
bw.interRegion.Azure = 0.008
bw.interProvider.Google = 0.01
bw.interProvider.AWS = 0.01
bw.interProvider.Azure = 0.01

# Section 4.4 : stockage standard ($ / GB / mois)
storage.price.gbMonth = 0.02

# ---- Donnees et infrastructure ----------------------------------------------
relations.perSite = 20
relation.sizeGb = 0.45
vms.perRegion = 20
hosts.perDatacenter = 10
host.pes = 8
host.ram = 65536
host.bw = 10000000
host.storage = 10000000
vm.ram = 2048
vm.bw = 100000
vm.size = 10000

# ---- Seuils SLA (Table 1) ---------------------------------------------------
sla.simple.TSLA = 200
sla.simple.CSLA = 0.015
sla.complex.TSLA = 400
sla.complex.CSLA = 0.040
psla = 200

# ---- Charge CPU des requetes [CALIBRE] --------------------------------------
# Longueur des cloudlets (MI) ; le cout CPU = prix Table 1 x MI / 10^6 et le
# temps d'execution est calcule par CloudSim : longueur / MIPS de la VM.
vm.mips = 48000000
cloudlet.simple = 100000
cloudlet.complex = 1200000
cloudlet.write = 50000
# Fraction lue de chaque relation (1 = relation lue entiere, comme l'article)
query.selectivity = 1.0

# ---- Modele de latence hierarchique [CALIBRE] (ms) --------------------------
geo.US-UE = 35
geo.UE-AS = 45
geo.US-AS = 60
lat.local.base = 0.5
lat.local.perGb = 4
lat.region.perGb = 15
lat.provider.overhead = 17
lat.provider.perGb = 40

# ---- Scenarios ---------------------------------------------------------------
article.queries = 1000
article.qps = 1.0
seeds = 10
sensitivity.seeds = 5

# Seuils des ecritures (S3) : memes valeurs que les requetes simples
sla.write.TSLA = 200
sla.write.CSLA = 0.015

# ---- Scenario dynamique S3 (en nombre de requetes) ---------------------------
# 3000 requetes a 1 requete/s, de la meme forme que l'article (relations lues entieres).
# Periode = 50 requetes ; cycle follow-the-sun = 3 phases (AS, UE, US) de 5 periodes.
s3.queries = 3000
s3.qps = 1.0
s3.periodQueries = 50
s3.phasePeriods = 5
s3.cycle = 15
s3.templates = 12
s3.zipf = 1.1
s3.blendPeriods = 2
s3.dominant = 0.70
s3.homeBoost = 1.0
s3.writeProb = 0.15
s3.deltaFrac = 0.05
# PSLA (Eq. 1, acces par periode), suppression : < 2 acces/periode pendant 12 periodes
s3.psla = 5.0
s3.delPsla = 2.0
s3.deltaT = 12
s3.budgetFactor = 0.95
s3.priceChangePeriod = 30

# ---- TCDRM-Predictive (Sujet 2) ---------------------------------------------
p2.weights = 0.4,0.3,0.15,0.15
p2.horizon = 5
p2.maxPerRel = 3
p3.syncFactor.Critical = 1.0
p3.syncFactor.ReadMostly = 0.4
p3.syncFactor.Eventual = 0.2
p1.window = 15
p1.minLen = 15
p1.ema.alpha = 0.3
p1.lstm.hidden = 16
p1.lstm.samples = 30000
p1.lstm.lr = 0.003
# Protocole de validation de P1 : semaines (graines) distinctes
p1.trainSeeds = 1000,1001
p1.valSeed = 1100
p1.testSeeds = 0,1,2
p1.inits = 5
p1.lstm.maxEpochs = 40
p1.lstm.patience = 5
p1.valSamples = 8000
p1.bootstrap = 2000

# ---- Journal CloudSim (désactivé par défaut : des millions de lignes sur toute la campagne)
# true : écrit le journal d'UNE exécution (la première dont le nom contient cloudsim.log.run)
cloudsim.log = true
cloudsim.log.run = TCDRM-Predictive
cloudsim.log.file = results/cloudsim_trace.log

# ---- Améliorations v2 de TCDRM-Predictive -------------------------------------
# Poids dynamiques : ω_coût × (1 + β·u), u = dépense projetée du cycle / budget
v2.dynBeta     = 2.0
# Saturation : capacité (réplicas par site) et poids du 5e critère d'occupation
v2.satCapacity = 10
v2.satWeight   = 0.15
# Anti-thrashing : garder un réplica si la demande prévue ≥ facteur × seuil de suppression
# (0,25 choisi sur les graines 200 à 209, distinctes des graines d évaluation 0 à 9)
v2.retainFactor = 0.25
# Scalabilité : graines par configuration
v2.scal.seeds  = 5
