cloudsim.log = true
cloudsim.log.run = TCDRM-Predictive
cloudsim.log.file = results/cloudsim_trace.log

# ---- Améliorations v2 de TCDRM-Predictive -------------------------------------
# Poids dynamiques : ω_coût × (1 + β·u), u = dépense projetée du cycle / budget
v2.dynBeta     = 2.0
# Saturation : capacité (réplicas par site) et poids du 5e critère d'occupation
v2.satCapacity = 10
v2.satWeight   = 0.15
# Anti-thrashing : garder un réplica si la demande prévue ≥ facteur × seuil de suppression
# (0,25 choisi sur les graines 200 à 209, distinctes des graines d évaluation 0 à 9)
v2.retainFactor = 0.25
# Scalabilité : graines par configuration
v2.scal.seeds  = 5
